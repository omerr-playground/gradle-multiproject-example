plugins {
    id 'java'
    id "jacoco"
    id 'org.springframework.boot' version '3.4.2' 
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    springBootVersion = '3.5.9'
}

jacoco {
    toolVersion = "0.8.11"
}

group 'com.foo'

repositories {
    mavenLocal()
    maven { url 'https://jitpack.io' }
    mavenCentral()
    google()
}


dependencies {
    implementation files("libs/cdar-common-logging-utility-0.0.1.jar")

    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-activemq'
    implementation 'org.springframework:spring-web'
    //implementation 'org.springframework:spring-core'

//    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.1'
    implementation group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.1'
    compileOnly "org.projectlombok:lombok:1.18.20"
    annotationProcessor "org.projectlombok:lombok:1.18.20"
    
    implementation group: 'org.apache.activemq', name: 'activemq-broker', version: '5.17.7'

    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.1'

    implementation group: 'com.microsoft.azure', name: 'azure-storage', version: '8.6.6'
    implementation group: 'com.azure', name: 'azure-storage-queue', version: '12.24.1'
    implementation group: 'com.azure', name: 'azure-core', version: '1.55.2'
    implementation group: 'com.azure', name: 'azure-identity', version: '1.12.2'
    implementation group: 'com.azure', name: 'azure-security-keyvault-keys', version: '4.2.0'
    implementation group: 'com.azure', name: 'azure-security-keyvault-secrets', version: '4.2.2'
    implementation group: 'com.azure', name: 'azure-storage-file-share', version: '12.15.0'
    implementation group: 'com.azure', name: 'azure-storage-file-datalake', version: '12.14.0'
    implementation('com.nimbusds:nimbus-jose-jwt') {
        version {
            strictly '9.37.2'
        }
    }
	implementation ('com.azure:azure-core-http-netty:1.15.10') {
        exclude group: 'io.netty', module: 'netty-handler'
    }
    //KeyVault
    implementation group: 'com.microsoft.rest', name: 'client-runtime', version: '1.7.14'
    implementation group: 'com.microsoft.azure', name: 'azure-keyvault', version: '1.2.6'
    implementation group: 'com.microsoft.azure', name: 'azure-client-authentication', version: '1.7.14'
    implementation 'org.yaml:snakeyaml:2.2'
    
	implementation 'org.apache.activemq:activemq-client:5.17.7'
	implementation 'org.apache.activemq:activemq-openwire-legacy:5.17.7'
    implementation ('com.azure:azure-messaging-servicebus:7.17.8') {
        exclude group: 'com.azure', module: 'azure-core-http-netty'
    }
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.springframework:spring-test:6.1.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation('org.hibernate:hibernate-core') {
        version {
            strictly '6.6.39.Final'
        }
    }
    implementation('ch.qos.logback:logback-classic') {
        version {
            strictly '1.5.13'
        }
    }
    implementation('ch.qos.logback:logback-core') {
        version {
            strictly '1.5.19'
        }
    }
	implementation('com.nimbusds:nimbus-jose-jwt') {
    version {
        strictly '9.37.2'
    }
}

}

tasks.named("bootJar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Start-Class': 'com.foo.NavigatorNrpsServiceApplication'
    }
}